[animation]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.windows_in]
duration_ms = 150
curve = "easeout"
style = "popin"
scale = 0.85

[animation.windows_out]
duration_ms = 150
curve = "easeout"
style = "fade"

[animation.windows_move]
duration_ms = 250
curve = "snappy"

[animation.workspaces]
duration_ms = 250
curve = "easeout"

[animation.overview]
duration_ms = 250
curve = "easeout"
workspace_curve = "spring:1,1000"

[overview]
zoom = 0.5
