[input]
middle_click_paste = true
window_drag_toggle = "none"

[input.keyboard]
layout = "tr"
variant = ""
options = ""
repeat_rate = 25
repeat_delay = 600
numlock_toggle = true
track_layout = "global"

[input.touchpad]
tap = true
natural_scroll = false

[input.mouse]
sensitivity = 0.0
scroll_wheel_step = 60

[input.tablet]
enabled = true

[input.focus]
follows_mouse = true
